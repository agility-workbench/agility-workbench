# Publishing workflow — the counterpart to ci.yml's non-publishing gates.
#
# Trigger: pushing a v* tag whose commit has a GREEN ci.yml run on it. The
# `publish` job downloads that run's `npm-tarballs` artifact and publishes
# those exact files — it never rebuilds (docs/maintainers/repository.md §7).
# The `github-release` job then posts the version's CHANGELOG.md entry as the
# GitHub Release on the tag (`node scripts/changelog.mjs section <version>`);
# a missing entry fails that job, after npm has published, until the entry
# lands and the run is retried.
#
# Auth: npm Trusted Publishing (OIDC). Each package on npmjs.com names this
# repository + workflow file as its trusted publisher, so no npm token exists
# anywhere. Requires npm >= 11.5.1 (Node 24 bundles npm 11); `id-token: write`
# also produces the provenance attestation the manifests already opt into.
#
# Rollout checklist (one-time, on npmjs.com and GitHub — see repository.md §6/§7):
#   1. GitHub repo → Settings → Environments → create `npm-publish`
#      (add required reviewers if you want a manual approval gate).
#   2. For EACH package on npmjs.com → Settings → Trusted Publisher →
#      GitHub Actions: repository owner/name, workflow `release.yml`,
#      environment `npm-publish`.
#   3. Optionally set each package's publishing access to
#      "Require two-factor authentication and disallow tokens" — trusted
#      publishing still works, classic tokens stop working.
name: Release

on:
  push:
    tags: ["v[0-9]*"]

permissions:
  contents: read
  id-token: write # OIDC: npm Trusted Publishing + provenance attestation

concurrency:
  group: release-${{ github.ref }}

jobs:
  publish:
    name: Publish tagged tarballs to npm
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm-publish
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # npm >= 11.5.1 is the Trusted Publishing floor; Node 24 bundles npm 11.
          # Deliberately NO registry-url here: setup-node would write an .npmrc
          # expecting NODE_AUTH_TOKEN, which OIDC publishing neither has nor needs.
          node-version: 24

      - name: npm version sanity
        run: npm --version

      # An annotated tag's github.sha is not reliably the commit — dereference it.
      - name: Resolve tagged commit
        id: commit
        run: echo "sha=$(git rev-parse 'HEAD^{commit}')" >> "$GITHUB_OUTPUT"

      - name: Find the green CI run for the tagged commit
        id: ci-run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id=$(gh api \
            "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?head_sha=${{ steps.commit.outputs.sha }}&status=success&per_page=1" \
            --jq '.workflow_runs[0].id')
          if [ -z "$run_id" ] || [ "$run_id" = "null" ]; then
            echo "::error::No successful CI run for ${{ steps.commit.outputs.sha }}. Let CI go green on this commit before tagging (or re-push the tag afterwards)."
            exit 1
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          name: npm-tarballs
          path: artifacts/npm
          run-id: ${{ steps.ci-run.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Verify every tarball's version matches the tag
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          ls -l artifacts/npm
          for t in artifacts/npm/*.tgz; do
            v=$(tar -xzOf "$t" package/package.json | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>console.log(JSON.parse(d).version))')
            echo "$t -> $v"
            if [ "$v" != "$tag_version" ]; then
              echo "::error::$t carries $v but the tag says $tag_version — retag the right commit."
              exit 1
            fi
          done

      # Core first: both bindings depend on it by semver range
      # (docs/maintainers/repository.md "Release order & version coupling").
      - name: Publish core, then bindings
        run: |
          npm publish artifacts/npm/agility-workbench-grid-*.tgz --provenance
          npm publish artifacts/npm/agility-workbench-react-grid-*.tgz --provenance
          npm publish artifacts/npm/agility-workbench-angular-grid-*.tgz --provenance

      - name: Verify on the registry
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          for p in grid react-grid angular-grid; do
            npm view "@agility-workbench/$p@$tag_version" version
          done

  # Release notes live in CHANGELOG.md (docs/maintainers/repository.md §6). Once npm has the
  # tarballs, post the tagged version's entry as the GitHub Release on the tag, so people who
  # watch releases get the same notes the docs site publishes. Re-running the workflow updates
  # the existing release instead of failing on it.
  github-release:
    name: Post the CHANGELOG entry as the GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # create or edit the release on the tag; nothing else
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Fails (and so marks the release red, after npm has published) when CHANGELOG.md has no
      # `## <version> — <date>` entry: add the entry on main, then re-run this job.
      - name: Extract this version's CHANGELOG entry
        run: |
          version="${GITHUB_REF_NAME#v}"
          anchor="v$(printf '%s' "$version" | sed -E 's/[^0-9A-Za-z]+/-/g')"
          notes="$RUNNER_TEMP/release-notes.md"
          # On its own line so a missing entry (exit 1) fails the step before any footer is written.
          node scripts/changelog.mjs section "$version" > "$notes"
          {
            printf '\n---\n\n'
            printf 'Full changelog: https://agilityworkbench.dev/docs/changelog#%s\n\n' "$anchor"
            printf 'npm: [core](https://www.npmjs.com/package/@agility-workbench/grid/v/%s) · ' "$version"
            printf '[React](https://www.npmjs.com/package/@agility-workbench/react-grid/v/%s) · ' "$version"
            printf '[Angular](https://www.npmjs.com/package/@agility-workbench/angular-grid/v/%s)\n' "$version"
          } >> "$notes"
          echo "--- release notes ---"
          cat "$notes"

      - name: Create or update the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          prerelease=""
          case "$version" in *-*) prerelease="--prerelease" ;; esac
          notes="$RUNNER_TEMP/release-notes.md"
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --title "$GITHUB_REF_NAME" --notes-file "$notes" $prerelease
          else
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --title "$GITHUB_REF_NAME" --notes-file "$notes" --verify-tag $prerelease
          fi
